# Run the FastAPI app in Docker. Supabase runs via Supabase CLI (supabase start) on the host.
# Usage:
#   supabase start && make env-supabase   # one-time: start Supabase and generate .env
#   docker compose up --build            # run the app (uses .env for Supabase URL/keys)

services:
  app:
    build: .
    container_name: business-development-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # From inside the container, reach Supabase on the host (Mac/Windows: host.docker.internal)
      - SUPABASE_URL=http://host.docker.internal:54321
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
